<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Core Arc Reactor Cyan Gradient -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Violet/Indigo Energy Gradient -->
    <linearGradient id="indigoCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Center J Emblem Gradient -->
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- 2. Ambient Core Glow -->
  <circle cx="256" cy="256" r="160" fill="#06b6d4" opacity="0.18" filter="url(#coreAura)" />
  <circle cx="256" cy="256" r="100" fill="#6366f1" opacity="0.25" filter="url(#coreAura)" />

  <!-- 3. Outer HUD Geometry: Concentric Rings & Orbitals -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.3" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 8" opacity="0.4" />
  
  <!-- 4. Futuristic Hexagonal Arc Reactor Cage -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" 
           fill="none" stroke="url(#cyanCore)" stroke-width="3.5" opacity="0.6" />

  <!-- Hexagon Vertex Circuit Nodes -->
  <circle cx="256" cy="96" r="6" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="394" cy="176" r="6" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="394" cy="336" r="6" fill="#818cf8" filter="url(#neonGlow)" />
  <circle cx="256" cy="416" r="6" fill="#818cf8" filter="url(#neonGlow)" />
  <circle cx="118" cy="336" r="6" fill="#818cf8" filter="url(#neonGlow)" />
  <circle cx="118" cy="176" r="6" fill="#38bdf8" filter="url(#neonGlow)" />

  <!-- Inner Concentric Orbit -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#indigoCore)" stroke-width="4" opacity="0.75" />

  <!-- 5. Causal DAG Directed Edges (Cross-connections) -->
  <line x1="160" y1="180" x2="256" y2="135" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" stroke-dasharray="3 3" />
  <line x1="352" y1="180" x2="256" y2="135" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" stroke-dasharray="3 3" />
  <line x1="160" y1="332" x2="256" y2="377" stroke="#818cf8" stroke-width="2.5" opacity="0.7" stroke-dasharray="3 3" />
  <line x1="352" y1="332" x2="256" y2="377" stroke="#818cf8" stroke-width="2.5" opacity="0.7" stroke-dasharray="3 3" />

  <!-- 6. Razor-Sharp "J" Causal Nexus Monogram -->
  <!-- Top Horizontal Bar -->
  <path d="M196 160 L320 160" 
        stroke="url(#jGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />
  
  <!-- Vertical Stem down to Hook -->
  <path d="M296 160 L296 295 C296 350 256 385 205 385 C165 385 145 358 145 330" 
        fill="none" stroke="url(#jGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- 7. High-Energy Core Vertices (Causal Intelligence Nodes) -->
  <circle cx="296" cy="160" r="11" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="196" cy="160" r="8" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="296" cy="295" r="9" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="145" cy="330" r="10" fill="#a855f7" filter="url(#neonGlow)" />

  <!-- Center Quantum Sparkle -->
  <polygon points="256,236 262,250 276,256 262,262 256,276 250,262 236,256 250,250" 
           fill="#ffffff" filter="url(#neonGlow)" opacity="0.9" />
</svg>
